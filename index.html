<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Grind</title>
    <style>
        :root {
            --space: 8px;
            --light: white;
            --dark: black;
        }

        .directory {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            flex-wrap: wrap;
            gap: calc(var(--space) / 2);
        }

        .directory>* {
            flex-basis: 50px;
            flex-grow: 1;
            padding: calc(var(--space) / 2);
            text-align: center;
        }

        .directory>*>*+* {
            border-top: 1px solid var(--light)
        }

        html {
            height: 100%;
        }

        body {
            color-scheme: light dark;
            font-size: 1rem;
            line-height: 1.25rem;
            font-family: sans-serif;
            height: 100%;
        }

        dialog {
            padding: 0;

            .dialog_wrapper {
                padding: var(--space);
            }
        }

        .spaced {
            display: flex;
            align-items: center;
            gap: var(--space);
        }

        .v-spaced {
            display: flex;
            flex-direction: column;
            gap: var(--space);
        }

        button {
            border: 0;
            padding: var(--space);
        }

        input {
            border: 0;
            padding: var(--space);
        }

        .bigger {
            font-size: 3rem;
        }

        @media (prefers-color-scheme: light) {

            body,
            text,
            svg {
                color: var(--dark);
                fill: var(--dark);
                background-color: var(--light);
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --light: rgb(24, 110, 31);
                --dark: rgb(226, 226, 226);
            }

            body {
                background: linear-gradient(to top left, magenta, blue)
            }

            body,
            text,
            svg {
                color: var(--dark);
                fill: var(--dark);
                background-color: var(--light);
            }
        }

        .wrong {
            color: darkred;
        }

        label {
            display: flex;
            gap: calc(var(--space) / 2);
            flex-direction: column;
        }

        .toast {
            position: absolute;
            inset: 50%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        content {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 80vh;
        }

        header h1 {
            font-size: 1rem;
            line-height: 1.25rem;
            display: inline-block;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>
    <outlet></outlet>
    <script type="text/javascript">
        //@ts-check
        class State {
            config_key = "grind_config"
            stones_key = "grind_stones"
            session_key = "grind_session"

            remove(k) {
                const name = this.stones[k].name
                delete this.stones[k]
                if (this.config.selected == k) {
                    delete this.config.selected
                }
            }

            select(id) {
                state.config.selected = id;
                this.sanitize()
            }

            selected() {
                const selected = this.config?.selected
                if (!selected) {
                    return null
                }
                return this.stones[selected] ?? null
            }

            load() {
                this.config = JSON.parse(localStorage.getItem(this.config_key) ?? "{}")
                this.stones = JSON.parse(localStorage.getItem(this.stones_key) ?? "{}")
                this.session = JSON.parse(localStorage.getItem(this.session_key) ?? "{}")
                this.sanitize()
            }

            verifyNudge(answer, nudge) {
                const correctAnswer = this.selected().nudges[nudge.id].a
                const question = this.selected().nudges[nudge.id].q
                const now = atMidhnight(new Date())
                const nowMilis = now.getTime()
                const valid = correctAnswer == answer
                if (valid) {
                    sharpen(this.selected(), nudge, nowMilis)
                } else {
                    dent(this.selected(), nudge, nowMilis)
                }
                return [answer, correctAnswer, question, valid]
            }

            save() {
                localStorage.setItem(this.config_key, JSON.stringify(this.config ?? {}))
                localStorage.setItem(this.stones_key, JSON.stringify(this.stones ?? {}))
                localStorage.setItem(this.session_key, JSON.stringify(this.session ?? {}))
            }

            sanitize() {
                if (!this.config?.selected) {
                    return
                }
                const selected = this.selected()
                if (!selected) {
                    return
                }
                if (Array.isArray(selected.groves)) {
                    selected.groves = {}
                }
                const groves = selected.groves
                const nudges = selected.nudges
                const nudgeKeys = new Set(Object.keys(nudges))
                const groveKeys = new Set(Object.keys(groves))

                const missingGroves = nudgeKeys.difference(groveKeys)
                missingGroves.forEach(key => groves[key] = { id: key, next: 0 })

                const orphanGroves = groveKeys.difference(nudgeKeys)
                orphanGroves.forEach(key => delete groves[key])
            }
        }
        const state = new State()
        state.load()
        render()

        function svg(tag, children = [], opts = {}) {
            const el = document.createElementNS("http://www.w3.org/2000/svg", tag)
            el.append(...children)
            for (const [key, value] of Object.entries(opts)) {
                if (key === 'value') {
                    if (value != undefined) {
                        el.setAttribute(key, value)
                        el.value = value
                    }
                } else if (key.startsWith('$')) {
                    el.addEventListener(key.substring(1), value)
                } else if (key == 'class') {
                    el.classList.add(...(value.split(' ')))
                } else if (key == 'disabled') {
                    if (value) {
                        el.setAttribute(key, value)
                    }
                } else {
                    el.setAttribute(key, value)
                }
            }
            return el
        }

        function e(tag, content, opts = {}) {
            const el = document.createElement(tag)
            if (Array.isArray(content)) {
                el.append(...content)
            } else if (content) {
                el.append(content)
            }
            if (tag == "button" && !opts.type) {
                opts.type = "button"
            }
            for (const [key, value] of Object.entries(opts)) {
                if (key === 'value') {
                    if (value != undefined) {
                        el.setAttribute(key, value)
                        el.value = value
                    }
                } else if (key.startsWith('$')) {
                    el.addEventListener(key.substring(1), value)
                } else if (key == 'class') {
                    el.classList.add(...(value.split(' ')))
                } else if (key == 'disabled') {
                    if (value) {
                        el.setAttribute(key, value)
                    }
                } else {
                    el.setAttribute(key, value)
                }
            }
            return el
        }

        function modal(content) {
            const wrapper = e('div', [content], { class: 'dialog_wrapper' })
            const dialog = e("dialog", wrapper, { $close: () => dialog.remove() })
            document.body.appendChild(dialog)
            dialog.showModal()
            dialog.addEventListener('click', (ev) => {
                if (ev.target === dialog) {
                    dialog.close();
                }
            });
        }

        function atMidhnight(date) {
            date.setHours(0, 0, 0, 0)
            return date
        }

        function sharpen(stone, nudge, now) {
            nudge.next = now + (((nudge.l ?? 0) + 1) * 24 * 60 * 60 * 1000)
            nudge.l = (nudge.l ?? 0) + 1
        }

        function dent(stone, nudge, now) {
            nudge.l = 0
            nudge.next = now
        }

        function toast(content, autoclose = true) {
            const toast = e('dialog', content, { class: "toast" })
            document.body.append(toast)
            toast.show()
            if (autoclose) {
                setTimeout(() => {
                    toast.close()
                    toast.remove()
                }, 3000);
            }
        }

        function download(data, filename, type) {
            var file = new Blob([data], { type: type });
            var a = document.createElement("a"),
                url = URL.createObjectURL(file);
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(function () {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 0);
        }

        function removeDialog(k, self) {
            const content = e('div', [
                e('span', `${state.stones[k].name} wirklich löschen?`),
                e('div', [
                    e('button', ['Ja'], {
                        type: "button", $click: (event) => {
                            state.remove(k)
                            toast(`${name} gelöscht!`)
                            state.save()
                            render()
                            self.render()
                            event.target.closest("dialog")?.close()
                        }
                    }),
                    e('button', ['Nein'], {
                        type: "button", $click: (event) => {
                            event.target.closest("dialog")?.close()
                        }
                    })
                ], { class: "spaced" })
            ], { class: 'v-spaced' })
            modal(content)
        }

        function sluggy(v) {
            return v //TODO: sluggify
        }

        function showNewSet() {
            const newSetForm = e("form", [
                e('span', ["Neues Set"]),
                fieldFn("Name des Sets", { name: "name", required: true }),
                e("button", ["Set erstellen"], { type: "submit" })
            ], {
                class: "v-spaced",
                $submit: async (event) => {
                    const fd = new FormData(event.target)
                    const name = fd.get("name")
                    const key = sluggy(name)
                    const stone = {
                        name,
                        key,
                        nudges: {},
                        groves: {}
                    }
                    state.stones[stone.key] = stone
                    stone.groves = {};
                    [...Object.keys(stone.nudges)].forEach(k => stone.groves[k] = { id: k, next: 0 })
                    state.config.selected = stone.key
                    toast("Erstellt")
                    state.save()
                    render()
                    event.target.closest("dialog")?.close()
                }
            })
            modal(newSetForm)
        }

        function ingestData(data) {
            const stone = JSON.parse(data)
            if (typeof stone.key !== "string") {
                throw ("key needs to be a string")
            }
            if (typeof stone.name !== "string") {
                throw ("name needs to be a string")
            }
            if (Array.isArray(stone.nudges) && typeof stone.nudges === "object") {
                throw ("nudges needs to be an object")
            }
            if (!Object.keys(stone.nudges).every(k => typeof k === "string")) {
                throw ("nudge keys need to be strings")
            }
            const verifyNudge = (nudge) => {
                if (typeof nudge.q !== "string") {
                    throw ("nudge.q needs to be a string")
                }
                if (typeof nudge.a !== "string") {
                    throw ("nudge.a needs to be a string")
                }
            }
            Object.values(stone.nudges).forEach(verifyNudge)
            state.stones[stone.key] = stone
            stone.groves = {};
            [...Object.keys(stone.nudges)].forEach(k => stone.groves[k] = { id: k, next: 0 })
            state.config.selected = stone.key
            toast("Importiert!")
            state.save()
        }

        class SelectionComponent {
            element = null
            render() {
                const rows = [...Object.entries(state.stones)]
                    .map(([k, v]) => e("div", [
                        e('span', v.name, { style: "flex-grow:1" }),
                        e('button', ['Wählen'], {
                            disabled: state.config.selected == k,
                            $click: (event) => {
                                state.select(k)
                                state.save()
                                render()
                                event.target.closest("dialog")?.close()
                            }
                        }),
                        e('button', ['Export'], {
                            $click: () => {
                                download(JSON.stringify(state.stones[k]), `${k}-grind.json`, 'application/json')
                            }
                        }),
                        e('button', ['🗑'], {
                            $click: () => {
                                removeDialog(k, this)
                            }
                        }),
                    ], { class: "spaced" }))
                const existingSelection = e("div", rows, { class: "v-spaced" })
                const fileImportForm = e("form", [
                    e("input", [], { name: "file", type: "file", required: true, style: "flex-grow:1" }),
                    e("button", ["Datei laden"], { type: "submit" })
                ], {
                    class: "spaced",
                    method: "dialog",
                    $submit: async (event) => {
                        const fd = new FormData(event.target)
                        const filehandle = fd.get("file")
                        if (!filehandle || typeof filehandle === "string") {
                            return
                        }
                        const content = await filehandle.text()
                        ingestData(content)
                        render()
                        this.render()
                    }
                })
                const remoteImportForm = e("form", [
                    e("input", [], { name: "url", type: "text", required: true, style: "flex-grow:1" }),
                    e("button", ["Url laden"], { type: "submit" })
                ], {
                    class: "spaced",
                    method: "dialog",
                    $submit: async (event) => {
                        event.preventDefault()
                        const fd = new FormData(event.target)
                        const url = fd.get("url")
                        if (typeof url !== "string") {
                            return
                        }
                        const response = await fetch(url)
                        const content = await response.text()
                        ingestData(content)
                        render()
                        this.render()
                    }
                })
                const exampleRemotes = e('ul', [
                    e('li', URL.parse('hiragana-grind.json', location.href)),
                    e('li', URL.parse('hiragana-single-grind.json', location.href)),
                    e('li', URL.parse('hiragana-duo-grind.json', location.href)),
                    e('li', URL.parse('hiragana-single-dia-grind.json', location.href)),
                    e('li', URL.parse('hiragana-duo-dia-grind.json', location.href)),
                ])
                const content = e('div', [existingSelection, fileImportForm, remoteImportForm, exampleRemotes], { class: 'v-spaced' })
                if (this.element) {
                    this.element.replaceWith(content)
                }
                this.element = content
                return this.element
            }
        }

        function showSelection() {
            const selection = new SelectionComponent()
            modal(selection.render())
        }

        function fieldFn(label, opts) {
            return e('label', [e('span', [label]), e('input', [], opts)])
        }

        function nudgeForm(nudge = {}, cb) {
            const remove = (event) => {
                const current = state.stones[state.config.selected]
                delete current.nudges[nudge?.id]
                delete current.groves[nudge?.id]
                state.save()
                cb()
                render()
                event.target.closest("dialog")?.close()
            }
            const selectionForm = e("form", [
                e("div", [state.stones[state.config.selected].name]),
                fieldFn("Id", { name: "id", type: "input", value: nudge.id, required: true }),
                fieldFn("Frage", { name: "q", type: "input", value: nudge.q, required: true }),
                fieldFn("Antwort", { name: "a", type: "input", value: nudge.a, required: true }),
                e("button", [nudge.id ? "Ändern" : "Hinzufügen"], { type: "submit" }),
                nudge.id != undefined ? e("button", ["Löschen"], { type: "button", $click: remove }) : '',
            ], {
                class: "v-spaced",
                method: "dialog",
                $submit: async (event) => {
                    event.preventDefault()
                    const fd = new FormData(event.target)
                    const id = fd.get("id")
                    const a = fd.get("a")
                    const q = fd.get("q")
                    if (!id || !q || !a) {
                        return
                    }
                    const current = state.stones[state.config.selected]
                    current.nudges[id] = { q, a }
                    if (nudge.id !== id) {
                        if (nudge?.id) {
                            delete current.groves[id]
                        }
                        current.groves[id] = { id, next: 0 }
                    }
                    toast("Added!")
                    state.save()
                    cb()
                    render()
                    event.target.closest("dialog")?.close()
                }
            })
            modal(selectionForm)
        }

        class CurrentSetComponent {
            element = null

            render() {
                const nudges = state.stones[state.config.selected].nudges
                const renderTile = ([id, v]) => {
                    return e('button', [e('div', v.q), e('div', v.a)], { $click: () => nudgeForm({ id, ...v }, () => this.render()) })
                }
                const content = e('div', [
                    ...[...Object.entries(nudges)].map(renderTile)
                ], { class: "directory" })
                if (this.element) {
                    this.element.replaceWith(content)
                }
                this.element = content
                return this.element
            }
        }

        function showAll() {
            modal(new CurrentSetComponent().render())
        }

        function newSession() {
            const now = atMidhnight(new Date())
            const nowMilis = now.getTime()
            const selectedStone = state.selected()
            const groves = selectedStone.groves
            state.session = {}
            const available = [...Object.values(groves)].filter((v) => v.next <= nowMilis)
            state.session[`${nowMilis}-${selectedStone.key}`] = shuffle(available).slice(0, 20)
        }

        function currentSession() {
            const selectedStone = state.selected()
            const now = atMidhnight(new Date())
            const nowMilis = now.getTime()
            if (!state?.session?.[`${nowMilis}-${selectedStone.key}`]) {
                newSession()
            }
            return state?.session?.[`${nowMilis}-${selectedStone.key}`].filter((v) => v.next <= nowMilis)
        }

        // https://en.wikipedia.org/wiki/Fisher%E2%80%93Yates_shuffle
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array
        }

        function randomElement(arr) {
            return shuffle(arr)[0]
        }

        function render() {
            const outlet = document.querySelector("outlet") ?? e("outlet")
            if (!outlet.parentElement) {
                document.body.append(outlet)
            }
            outlet.innerHTML = ""
            const leftSide = e('div', [], { class: "spaced" })
            const rightSide = e('div', [
                e("button", ["Sets"], { $click: () => showSelection() })
            ], { class: "spaced" })
            const header = e('header', [
                leftSide,
                rightSide
            ])
            outlet.append(header)
            const selectedStone = state.selected()
            if (selectedStone) {
                const now = atMidhnight(new Date())
                const nowMilis = now.getTime()
                const nudges = currentSession()

                leftSide.append(e("h1", [selectedStone.name]))
                rightSide.append(e("button", ["+"], { type: "button", $click: () => nudgeForm() }))
                rightSide.append(e("button", ["≡"], { type: "button", $click: () => showAll() }))

                if (nudges.length == 0) {
                    outlet.append(e("div", [e('p', ["All done!"]), e('p', ["Keine offenen Aufgaben."])], { style: "text-align:center" }))
                    return
                } else {
                    leftSide.append(e("span", [`(offen: ${nudges.length})`]))
                }
                const nudge = randomElement(nudges)
                const answerInput = e("input", [], { name: "answer", autocomplete: "off", autocorrect: "off", autocapitalize: "none", autofocus: true })
                const form = e("form", [
                    answerInput,
                    e("button", [">"], { type: "submit", style: "font-weight: bold" })
                ], {
                    class: "spaced",
                    $submit: (event) => {
                        event.preventDefault()
                        const fd = new FormData(event.target)
                        const answer = fd.get("answer")
                        renderResult(...state.verifyNudge(answer, nudge))
                        state.save()
                    }
                })
                const content = e('content', [
                    svg("svg", [svg("text", [selectedStone.nudges[nudge.id].q])]),
                    form
                ])
                outlet.append(content)
                answerInput.focus()
            } else {
                leftSide.append(e("h1", ['🦜']))
                outlet.append(e('div', [
                    e('h2', 'Hallo!'),
                    e('p', 'Es ist kein Set gewählt.'),
                    e('p', 'Set wählen:'),
                    e("button", "Sets", { $click: () => showSelection() }),
                    e('p', 'Neues Set anlegen:'),
                    e("button", "Neues Set", { $click: () => showNewSet() })
                ], { style: "text-align: center" }))
            }
            const svgs = document.querySelectorAll("svg");
            svgs.forEach(element => {
                const bbox = element.querySelector("text")?.getBBox();
                if (bbox) {
                    element.setAttribute("viewBox", [bbox.x, bbox.y, bbox.width, bbox.height].join(" "));
                }
            });
        }

        function renderResult(answer, correctAnswer, question, valid) {
            const outlet = document.querySelector("outlet") ?? e("outlet")
            if (!outlet.parentElement) {
                document.body.append(outlet)
            }
            outlet.innerHTML = ""
            let displayTime = 3000
            if (valid) {
                displayTime = 1500
                outlet.append(e('content', [e('p', ["✔"], { style: "color: green" }), e('p', [question, ' ', correctAnswer])], { class: "bigger" }))
            } else {
                outlet.append(e('content', [e('p', ["✘"], { style: "color: red" }), e('p', [answer], { class: "wrong" }), e('p', [question, ' ', correctAnswer])], { class: "bigger" }))
            }
            setTimeout(() => render(), displayTime)
        }
    </script>
</body>

</html>
