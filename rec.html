<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type=application/ld+json>
        {
            "@context": "https://schema.org",
            "@type": "Recipe",
            "name": "Laksa mit Fischbällchen auf Singapur-Art",
            "recipeYield": "4 Portionen",
            "recipeIngredient": [
              "5 große Knoblauchzehen",
              "1 Schalotte",
              "1 Stange Zitronengras",
              "1 frische rote Chili",
              "1 Stück frischer Galgant oder frischer Ingwer (2,5 cm)",
              "1 Stück frische Kurkumawurzel (2,5 cm) oder 1 gehäufter TL Kurkumapulver",
              "3 EL getrocknete Garnelen, 5 Minuten in kaltem Wasser eingeweicht, abgetropft",
              "2 EL Sonnenblumenöl, plus etwas mehr nach Geschmack",
              "1 TL feine Erdnussbutter",
              "1/2 TL getrocknete Chiliflocken",
              "2 EL Sonnenblumenöl oder Kokosöl",
              "400 ml Kokosmilch",
              "750 ml Hühnerbrühe",
              "1 EL Fischsoße oder mehr nach Geschmack",
              "1 EL Palmzucker",
              "feines Salz",
              "12 rohe Riesengarnelen, ausgelöst und Darmfäden entfernt",
              "8 thailändische Fischbällchen (Fertigprodukt)",
              "200 g flache Reisnudeln",
              "80 g Bohnensprossen",
              "2 EL frische Korianderblätter",
              "1 frische rote Chili, in Ringen",
              "1 Limette, in Spalten"
            ],
            "recipeInstructions": [
              {
                "@type": "HowToStep",
                "text": "Für die Laksa-Paste Knoblauch und Schalotte schälen und mit Zitronengras, roter Chili, Galgant und Kurkuma zunächst mit einem Nudelholz aufbrechen und dann grob hacken."
              },
              {
                "@type": "HowToStep",
                "text": "Mit Garnelen, Sonnenblumenöl, Erdnussbutter und Chiliflocken in einem Standmixer zu einer weichen Paste verarbeiten."
              },
              {
                "@type": "HowToStep",
                "text": "Wenn sich die Mischung nicht pürieren lässt, etwas mehr Öl zufügen."
              },
              {
                "@type": "HowToStep",
                "text": "Für die Suppe das Sonnenblumen- oder Kokosöl in einem großen Topf auf hoher Stufe erhitzen."
              },
              {
                "@type": "HowToStep",
                "text": "Die Laksa-Paste darin unter ständigem Rühren 2–3 Minuten braten, bis sie zu duften beginnt."
              },
              {
                "@type": "HowToStep",
                "text": "Kokosmilch zufügen und gründlich unterrühren."
              },
              {
                "@type": "HowToStep",
                "text": "Hühnerbrühe, Fischsoße und Palmzucker einrühren und das Ganze zum Köcheln bringen."
              },
              {
                "@type": "HowToStep",
                "text": "15 Minuten köcheln, bis die Suppe leicht eindickt."
              },
              {
                "@type": "HowToStep",
                "text": "Mit Fischsoße oder einer großzügigen Prise Salz abschmecken."
              },
              {
                "@type": "HowToStep",
                "text": "Garnelen und Fischbällchen zufügen und 2–3 Minuten garen, bis die Garnelen sich krümmen und orange-pink verfärbt haben."
              },
              {
                "@type": "HowToStep",
                "text": "Vom Herd nehmen."
              },
              {
                "@type": "HowToStep",
                "text": "Die Reisnudeln nach Packungsanweisung garen und auf 2 Suppenschalen verteilen."
              },
              {
                "@type": "HowToStep",
                "text": "Mit Suppe aufgießen und mit Garnelen, Fischbällchen und einem Nest aus Bohnensprossen krönen."
              },
              {
                "@type": "HowToStep",
                "text": "Mit Chiliringen und Koriander garnieren und mit einer Limettenspalte servieren."
              }
            ]
          }
    </script>
</head>

<body>

</body>

</html>
